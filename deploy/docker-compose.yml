# Staging / single-server production. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# deploy/setup.sh does all of this for you.

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: whatsapp-bot:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - storage:/app/backend/storage

services:
  web:
    <<: *app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/app/backend/storage
      - caddy_data:/data
      - caddy_config:/config

  worker:
    <<: *app
    command: php artisan queue:work redis --queue=webhooks,outbound,default --sleep=1 --max-time=3600

  scheduler:
    <<: *app
    command: php artisan schedule:work

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  storage:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
